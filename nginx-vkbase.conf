# Отдельный сервис VK Base. Основное приложение iiai.pro не меняется.
# В основном reverse proxy нужен только этот location; сам контент хранится независимо.
location = /vkbase { return 301 /vkbase/; }
location /vkbase/ {
    alias /srv/vkbase/current/;
    try_files $uri $uri/ /vkbase/index.html;
    add_header Cache-Control "public, max-age=300";
}
